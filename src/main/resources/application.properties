# ============================================================
# JFrog Artifactory / Xray (REST, no MCP needed)
# Used by the vulnerability panel, /api/v1/dashboard/vulnerabilities and the jfrog_/xray_/maven_ agent tools.
# ============================================================
jfrog.base-url=${JFROG_BASE_URL:${JFROG_URL:https://global-artifacts.se.com}}
jfrog.token=${JFROG_ACCESS_TOKEN:${JFROG_API_TOKEN:}}
jfrog.docker-repo=${JFROG_DOCKER_REPO:sd-ei-emh-eu-docker-prod-fed}
jfrog.docker-host=${JFROG_DOCKER_HOST:global-artifacts.se.com}
jfrog.maven-repo=${JFROG_MAVEN_REPO:libs-release-prod-virtual}
# Scan results are cached; the first load after start scans every latest release image (takes a few minutes)
jfrog.cache-ttl-minutes=${JFROG_CACHE_TTL_MINUTES:360}
jfrog.parallelism=${JFROG_PARALLELISM:6}
jfrog.startup-refresh=${JFROG_STARTUP_REFRESH:true}
# Optional corporate proxy for the JVM (leave empty when JFrog/GHES are directly reachable)
jfrog.proxy-host=${JFROG_PROXY_HOST:}
jfrog.proxy-port=${JFROG_PROXY_PORT:0}
# Image -> project overrides, e.g. jfrog.image-project-overrides.emh-date-processor=date-integration
# (images that cannot be mapped to a repository are grouped under 'other-images')

# ============================================================
# Local workspace used by the agent for code changes (clone, branch, mvn install, PR)
# ============================================================
workspace.dir=${WORKSPACE_DIR:${user.home}/.emh-ai-workspace}
workspace.git.command=${WORKSPACE_GIT_COMMAND:git}
# empty = mvn.cmd on Windows / mvn elsewhere
workspace.maven.command=${WORKSPACE_MAVEN_COMMAND:}
workspace.maven.default-timeout-minutes=25
workspace.maven.max-timeout-minutes=45
workspace.git.user-name=${WORKSPACE_GIT_USER_NAME:EMH AI Assistant}
workspace.git.user-email=${WORKSPACE_GIT_USER_EMAIL:emh-ai-assistant@se.com}

# Chat session TTL
ai.session.ttl-minutes=${AI_SESSION_TTL_MINUTES:60}

# ============================================================
# Executive Reporting & PowerPoint Generator
# ============================================================
report.output-dir=${REPORT_OUTPUT_DIR:reports}
report.python.path=${REPORT_PYTHON_PATH:python}

