dashboard.kafka.base-url=${KAFKA_CONNECT_URL:https://uat.emh.ei.se.com/api/kafka-connect-1}
dashboard.kafka.auth=${KAFKA_CONNECT_AUTH:Basic U2VFbWhUZWFtOldlbGNvbWUx}
