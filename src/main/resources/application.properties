# ============================================================
# Server Configuration
# ============================================================
server.port=8080

# Comma-separated frontend origins allowed to call /api/**
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

spring.application.name=spring-ai-mcp-poc
spring.config.import=optional:file:.env[.properties]
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

# ============================================================
# AI Provider Configuration
# ============================================================

# --- OpenAI-compatible endpoint (GitHub Models preferred) ---
# Uses GitHub token first; OPENROUTER_API_KEY is only a fallback if explicitly set.
spring.ai.openai.api-key=${COPILOT_GITHUB_TOKEN:${GITHUB_TOKEN:${OPENROUTER_API_KEY:dummy-key-for-copilot-mode}}}
spring.ai.openai.chat.api-key=${COPILOT_GITHUB_TOKEN:${GITHUB_TOKEN:${OPENROUTER_API_KEY:dummy-key-for-copilot-mode}}}
spring.ai.openai.speech.api-key=${COPILOT_GITHUB_TOKEN:${GITHUB_TOKEN:${OPENROUTER_API_KEY:dummy-key-for-copilot-mode}}}
spring.ai.openai.audio.transcription.api-key=${COPILOT_GITHUB_TOKEN:${GITHUB_TOKEN:${OPENROUTER_API_KEY:dummy-key-for-copilot-mode}}}
spring.ai.openai.base-url=${OPENAI_COMPAT_BASE_URL:https://models.inference.ai.azure.com}
spring.ai.openai.chat.options.model=${LLM_MODEL:gpt-5}
spring.ai.openai.chat.options.max-tokens=4096
spring.ai.openai.chat.options.temperature=0.7

# Active default LLM provider: "copilot" or "antigravity"
llm.providers=${LLM_PROVIDERS:copilot,antigravity}
ai.provider=${AI_PROVIDER:copilot}

# --- Spring AI Framework LLM Providers (ChatClient integration) ---
# GitHub Copilot (Spring AI ChatClient -> GitHub Models / Azure OpenAI endpoint)
copilot.enabled=true
copilot.base-url=${COPILOT_BASE_URL:${OPENAI_COMPAT_BASE_URL:https://models.inference.ai.azure.com}}
copilot.model=${COPILOT_MODEL:${LLM_MODEL:gpt-5}}

# Google Antigravity / Gemini (Spring AI ChatClient -> Gemini OpenAI-compatible endpoint)
antigravity.enabled=true
antigravity.base-url=${ANTIGRAVITY_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
antigravity.api-key=${ANTIGRAVITY_API_KEY:${GEMINI_API_KEY:dummy-key-for-antigravity}}
antigravity.model=${ANTIGRAVITY_MODEL:gemini-2.5-pro}

# Optional legacy CLI provider (fallback for Spring AI ChatClient when CLI is installed)
antigravity.cli.enabled=${ANTIGRAVITY_CLI_ENABLED:${ANTIGRAVITY_ENABLED:true}}
antigravity.cli.command=${ANTIGRAVITY_COMMAND:agy}
antigravity.cli.timeout-seconds=${ANTIGRAVITY_TIMEOUT_SECONDS:480}

# --- GitHub Copilot SDK (direct provider path) ---
# Enable to use provider="copilot" in /api/v1/ai/prompt
copilot.sdk.enabled=${COPILOT_SDK_ENABLED:false}
copilot.sdk.model=${COPILOT_MODEL:gpt-5}


# --- MCP Client Configuration ---
# Set to false to start app without MCP servers (chat-only mode)
spring.ai.mcp.client.enabled=${MCP_ENABLED:true}
spring.ai.mcp.client.type=ASYNC
spring.ai.mcp.client.request-timeout=${MCP_REQUEST_TIMEOUT:60s}
spring.ai.mcp.client.toolcallback.enabled=true

# ---- STDIO connections (local processes via npx) ----

# Git MCP Server (GitHub Enterprise Server: github.schneider-electric.com)
# Uses the official github-mcp-server binary (supports GitHub Enterprise via GITHUB_HOST).
# The npm @modelcontextprotocol/server-github package is hardcoded to api.github.com and cannot be used.
# GITHUB_ENTERPRISE_TOKEN must be a PAT created ON github.schneider-electric.com (not github.com).
# Toolsets: repos (read files, branches, commits, push), pull_requests, issues, git (repo tree), context, users.
# merge/delete/create-repo/fork tools are disabled on purpose: the agent may open PRs but never merge or destroy anything.
spring.ai.mcp.client.stdio.connections.git-mcp-server.command=${GITHUB_MCP_SERVER_PATH:github-mcp-server}
spring.ai.mcp.client.stdio.connections.git-mcp-server.args[0]=stdio
spring.ai.mcp.client.stdio.connections.git-mcp-server.args[1]=--toolsets=context,repos,issues,pull_requests,git,users
spring.ai.mcp.client.stdio.connections.git-mcp-server.args[2]=--exclude-tools=merge_pull_request,delete_file,create_repository,fork_repository
spring.ai.mcp.client.stdio.connections.git-mcp-server.env.GITHUB_HOST=${GITHUB_ENTERPRISE_HOST:https://github.schneider-electric.com}
spring.ai.mcp.client.stdio.connections.git-mcp-server.env.GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_ENTERPRISE_TOKEN:not-configured}

# Jira MCP Server (Jira Data Center)
spring.ai.mcp.client.stdio.connections.jira-mcp-server.command=cmd.exe
spring.ai.mcp.client.stdio.connections.jira-mcp-server.args[0]=/c
spring.ai.mcp.client.stdio.connections.jira-mcp-server.args[1]=npx
spring.ai.mcp.client.stdio.connections.jira-mcp-server.args[2]=-y
spring.ai.mcp.client.stdio.connections.jira-mcp-server.args[3]=@atlassian-dc-mcp/jira
spring.ai.mcp.client.stdio.connections.jira-mcp-server.env.JIRA_HOST=${JIRA_URL}
spring.ai.mcp.client.stdio.connections.jira-mcp-server.env.JIRA_EMAIL=${JIRA_EMAIL}
spring.ai.mcp.client.stdio.connections.jira-mcp-server.env.JIRA_API_TOKEN=${JIRA_API_TOKEN}

# Confluence MCP Server (Confluence Data Center)
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.command=cmd.exe
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.args[0]=/c
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.args[1]=npx
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.args[2]=-y
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.args[3]=@atlassian-dc-mcp/confluence
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.env.CONFLUENCE_HOST=${CONFLUENCE_URL:https://confluence.se.com}
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.env.CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL}
spring.ai.mcp.client.stdio.connections.confluence-mcp-server.env.CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}

# ---- SSE connections (remote hosted MCP servers) ----

# JFrog MCP Server (hosted by JFrog platform)
# DISABLED: JFrog instance does not expose MCP endpoint (returns 404)
#spring.ai.mcp.client.sse.connections.jfrog-mcp-server.url=${JFROG_MCP_URL}

# ServiceNow disabled - requires admin service account
#spring.ai.mcp.client.stdio.connections.servicenow-mcp-server.command=npx.cmd
#spring.ai.mcp.client.stdio.connections.servicenow-mcp-server.args=-y,@servicenow/mcp-server

# ============================================================
# Actuator & Management
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# Logging
# ============================================================
logging.level.com.schneider.ai=DEBUG
logging.level.org.springframework.ai=DEBUG


